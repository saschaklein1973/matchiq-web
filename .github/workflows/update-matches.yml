name: MatchIQ - Fußballspiele aktualisieren

on:
  schedule:
    - cron: "0 6,12,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchiq-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fußballspiele abrufen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ["FOOTBALL_DATA_API_KEY"]
          today = datetime.now(timezone.utc).date()
          start_date = today - timedelta(days=30)
          end_date = today + timedelta(days=10)

          matches = []
          seen_ids = set()
          current = start_date

          while current <= end_date:
              chunk_end = min(current + timedelta(days=9), end_date)
              url = (
                  "https://api.football-data.org/v4/matches"
                  f"?dateFrom={current.isoformat()}&dateTo={chunk_end.isoformat()}"
                  "&competitions=BL1,PL,PD,SA,FL1,DED,CL,WC,EC"
              )
              request = urllib.request.Request(
                  url, headers={"X-Auth-Token": key}
              )

              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as e:
                  print("HTTP-Fehler:", e.code, flush=True)
                  print(
                      "Antwort des Servers:",
                      e.read().decode("utf-8", errors="replace"),
                      flush=True,
                  )
                  raise

              for match in data.get("matches", []):
                  match_id = match.get("id")
                  if match_id is not None and match_id not in seen_ids:
                      seen_ids.add(match_id)
                      matches.append(match)

              print(
                  f"{current.isoformat()} bis {chunk_end.isoformat()}: "
                  f"{len(data.get('matches', []))} Spiele erhalten.",
                  flush=True,
              )
              current = chunk_end + timedelta(days=1)

          if not matches:
              raise RuntimeError(
                  "Keine Spiele erhalten. Alte Daten bleiben erhalten."
              )

          with open("matches.json", "w", encoding="utf-8") as file:
              json.dump(matches, file, ensure_ascii=False, indent=2)

          print(f"{len(matches)} Spiele gespeichert.")
          PY

      - name: Änderungen veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Fußballspiele automatisch aktualisieren"
            git push
          fi
